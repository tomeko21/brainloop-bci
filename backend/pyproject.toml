[project]
name = "brainloop-backend"
version = "0.1.0"
description = "BrainLoop API – reels feed, sessions, live EEG stream, ML predictions"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.17",
  "numpy>=2.1",
  "opencv-python-headless>=4.10,<5",
  "pylsl>=1.18.7",
  "scipy>=1.18.1",
  "brainaccess==4.0.0",
  "scikit-learn==1.9.1",
  "pandas>=2.2",
  "joblib>=1.4",
]

[project.scripts]
# uv run api: start the server with auto-reload
api = "app.__main__:main"
# uv run seed: sync the videos table from the CSV without starting the server
seed = "app.seed:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["ruff>=0.8", "httpx>=0.28"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
